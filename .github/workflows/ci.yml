# Checks every push and pull request: install, build, tests, and (on pull
# requests) that the Docker image still builds. Publishing is docker.yml's job.
name: ci

on:
  push:
  pull_request:

# A newer commit on the same branch / PR makes the older check pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Backend tests
        run: npm run --if-present test:backend

      - name: Is there an e2e script?
        id: scripts
        run: node -e "console.log('e2e=' + Boolean(require('./package.json').scripts?.['test:e2e']))" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        if: steps.scripts.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.scripts.outputs.e2e == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.scripts.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Catches Dockerfile breakage before merge. Single platform and no push;
  # docker.yml builds both platforms after the merge.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=docker-main
